const container = document.getElementById('sections');
data.forEach(section => {
  const div = document.createElement('div');

  const count = section.items.length;
  div.innerHTML = `<div class="section-title">${section.title} <span class="count-badge">${count} задач</span></div><div class="items"></div>`;
  const itemsDiv = div.querySelector('.items');
  section.items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    const priLabel = { critical: 'критическая', high: 'высокий', medium: 'средний', low: 'низкий' }[item.pri];
    const tags = item.tags.map(t => `<span class="tag">${t}</span>`).join(' ');
    el.innerHTML = `
      <div class="item-left">
        <div class="item-title">${item.title}</div>
        <div class="item-meta"><span style="color:var(--color-text-secondary)">${item.meta}</span></div>
        <div class="item-details" style="display:none">
          <p style="margin-bottom:8px">${item.details.replace(/\((\d+)\)/g, '<b>($1)</b>')}</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap">${tags}</div>
        </div>
      </div>
      <span class="pri pri-${item.pri}">${priLabel}</span>
      <span class="arrow">›</span>
    `;
    el.addEventListener('click', () => {
      const details = el.querySelector('.item-details');
      const expanded = el.classList.toggle('expanded');
      details.style.display = expanded ? 'block' : 'none';
    });
    itemsDiv.appendChild(el);
  });
  container.appendChild(div);
