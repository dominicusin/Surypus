<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surypus — Нет соединения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F5F5;
            color: #212121;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #E3F2FD;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 { font-size: 20px; margin-bottom: 12px; }
        p { color: #757575; margin-bottom: 28px; line-height: 1.5; }
        .btn {
            background: #1976D2;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1565C0; }
        .brand { color: #1976D2; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <div class="brand">Surypus ERP</div>
        <h1>Нет соединения</h1>
        <p>Проверьте подключение к интернету и попробуйте снова.<br>Ранее загруженные данные доступны в автономном режиме.</p>
        <button class="btn" onclick="window.location.reload()">Повторить попытку</button>
    </div>
</body>
</html>
