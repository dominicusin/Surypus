openapi: 3.0.3
info:
  title: SURYPUS API
  version: 1.0.0
  description: REST API for SURYPUS MVP Phase 2-3
servers:
  - url: http://localhost:8080/api/v1
    description: Local dev server
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
  /accounts:
    get:
      summary: List accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      summary: Create account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /accounts/{id}:
    get:
      summary: Get account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    put:
      summary: Update account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200':
          description: OK
    delete:
      summary: Delete account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /journal_entries:
    get:
      summary: List journal entries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
    post:
      summary: Create journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryInput'
      responses:
        '201':
          description: Created
  /journal_entries/{id}:
    get:
      summary: Get journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Update journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryInput'
      responses:
        '200':
          description: OK
    delete:
      summary: Delete journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
  /dashboard:
    get:
      summary: Dashboard data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /health:
    get:
      summary: Health
      responses:
        '200':
          description: OK
  /readiness:
    get:
      summary: Readiness
      responses:
        '200':
          description: Ready
  /balances/{accountId}:
    get:
      summary: Get balance for account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
    Account:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        description: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountInput:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        description: { type: string }
        is_active: { type: boolean }
      required: [code, name, type, currency]
    JournalEntry:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: integer }
        debit: { type: number }
        credit: { type: number }
        amount: { type: number }
        currency: { type: string }
        date: { type: string, format: date-time }
        description: { type: string }
        posted: { type: boolean }
        created_at: { type: string, format: date-time }
    JournalEntryInput:
      type: object
      properties:
        account_id: { type: integer }
        debit: { type: number }
        credit: { type: number }
        amount: { type: number }
        currency: { type: string }
        date: { type: string, format: date-time }
        description: { type: string }
        posted: { type: boolean }
      required: [account_id, amount, date]
    Bill:
      type: object
      properties:
        id: { type: integer }
        number: { type: string }
        date: { type: string, format: date-time }
        currency: { type: string }
        total_amount: { type: number }
        status: { type: string }
    Payment:
      type: object
      properties:
        id: { type: integer }
        payment_ref: { type: string }
        bill_id: { type: integer }
        amount: { type: number }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        revenue: { type: number }
        stockValue: { type: number }
        pendingPayments: { type: integer }
    Balance:
      type: object
      properties:
        accountId:
          type: integer
        balance:
          type: number
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        db:
          type: string
