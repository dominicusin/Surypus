# ReadTheDocs configuration for Surypus
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    nodejs: "20"

python:
  version: 3.11
  install:
    - method: pip
      path: docs/requirements.txt

formats:
  - pdf
  - epub
  - htmlzip
