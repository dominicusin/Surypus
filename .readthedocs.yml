version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    mkdocs: "1.6.1"
  commands:
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - python -m pip install --upgrade pip
    - pip install mkdocs mkdocs-material
    - mkdocs build --strict

python:
  version: 3.11
  install:
    - method: pip
      path: docs/requirements.txt

formats:
  - pdf
  - epub
  - htmlzip
