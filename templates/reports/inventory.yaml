# ============================================================================
# INVENTORY REPORT (Остатки товаров)
# ============================================================================

meta:
  title: "Остатки товаров"
  author: "Surypus ERP"
  subject: "Остатки на складе"
  creator: "Surypus PDF Generator"

page:
  paper-size: "A4"
  orientation: "portrait"
  margin-top: 15
  margin-bottom: 15
  margin-left: 15
  margin-right: 15

header:
  height: 35
  elements:
    - text:
        x: 0
        y: 0
        width: 190
        height: 8
        value: "ОСТАТКИ ТОВАРОВ"
        font-size: 14
        font-weight: "bold"
        text-align: "center"
    - text:
        x: 0
        y: 10
        width: 190
        height: 4
        value: "по состоянию на {{reportDate}}"
        font-size: 10
        text-align: "center"
    - text:
        x: 0
        y: 18
        width: 190
        height: 4
        value: "Склад: {{warehouseName}}"
        font-size: 9
        text-align: "center"
    - text:
        x: 0
        y: 25
        width: 190
        height: 4
        value: "{{companyName}}"
        font-size: 8
        text-align: "center"

page-header:
  height: 8
  elements:
    - text:
        x: 0
        y: 0
        width: 190
        height: 4
        value: "Группа товаров: {{goodsGroup}}"
        font-size: 8

body:
  repeat: true
  elements:
    - table:
        x: 0
        y: 0
        width: 190
        repeat-header: true
        columns:
          - width: 10
          - width: 50
          - width: 20
          - width: 25
          - width: 25
          - width: 30
          - width: 30
        rows:
          - - text: "№"
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Товар"
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Ед."
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Остаток"
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Цена"
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Сумма"
              font-weight: "bold"
              background-color: "#DDDDDD"
            - text: "Группа"
              font-weight: "bold"
              background-color: "#DDDDDD"
          - - text: "{{rowNumber}}"
            - text: "{{productName}}"
            - text: "{{unit}}"
            - text: "{{quantity}}"
            - text: "{{price}}"
            - text: "{{sum}}"
            - text: "{{group}}"

footer:
  height: 30
  elements:
    - line:
        x1: 0
        y1: 0
        x2: 190
        y2: 0
    - text:
        x: 0
        y: 3
        width: 100
        height: 4
        value: "Итого:"
        font-size: 9
        font-weight: "bold"
    - text:
        x: 100
        y: 3
        width: 90
        height: 4
        value: "{{totalSum}}"
        font-size: 9
        font-weight: "bold"
        text-align: "right"
    - text:
        x: 0
        y: 10
        width: 190
        height: 4
        value: "Наименований товаров: {{totalItems}}"
        font-size: 8
    - text:
        x: 0
        y: 16
        width: 190
        height: 4
        value: "Общее количество: {{totalQuantity}}"
        font-size: 8

page-footer:
  height: 8
  elements:
    - text:
        x: 0
        y: 0
        width: 190
        height: 4
        value: "Страница {{pageNumber}}"
        font-size: 7
        text-align: "center"
