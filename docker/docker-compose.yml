version: "3.8"

services:
  # ============================================================================
  # PostgreSQL with Event Store
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: surypus_postgres
    environment:
      POSTGRES_DB: surypus
      POSTGRES_USER: surypus
      POSTGRES_PASSWORD: surypus_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surypus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - surypus_network

  # ============================================================================
  # OPA (Open Policy Agent) for RBAC
  # ============================================================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: surypus_opa
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--log-format=json"
      - "--authentication=token"
      - "--authorization=basic"
      - "/policies"
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data:/data:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - surypus_network
    depends_on:
      - postgres

  # ============================================================================
  # Redpanda (Kafka-compatible) for Event Streaming
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: surypus_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092"
      - --pandaproxy-addr
      - "PLAINTEXT://0.0.0.0:8082,EXTERNAL://0.0.0.0:18082"
      - --advertise-pandaproxy-addr
      - "PLAINTEXT://redpanda:8082,EXTERNAL://localhost:18082"
      - --set
      - "redpanda.auto_create_topics_enabled=true"
    ports:
      - "9092:9092"
      - "19092:19092"
      - "8082:8082"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - surypus_network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redpanda Console (Kafka UI)
  # ============================================================================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: surypus_redpanda_console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    networks:
      - surypus_network
    depends_on:
      redpanda:
        condition: service_healthy

  # ============================================================================
  # Surypus Event Processor (Haskell)
  # ============================================================================
  surypus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surypus_api
    environment:
      - DATABASE_URL=postgresql://surypus:surypus_secret@postgres:5432/surypus
      - OPA_URL=http://opa:8181
      - KAFKA_BROKERS=redpanda:9092
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - surypus_network
    restart: unless-stopped

  # ============================================================================
  # Event Publisher (publishes events from Postgres outbox to Kafka)
  # ============================================================================
  event-publisher:
    image: debezium/postgres:16
    container_name: surypus_event_publisher
    entrypoint: ["/bin/bash", "/scripts/publish-events.sh"]
    volumes:
      - ./scripts/publish-events.sh:/scripts/publish-events.sh:ro
    environment:
      - DATABASE_URL=postgresql://surypus:surypus_secret@postgres:5432/surypus
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - surypus_network
    restart: unless-stopped

  # ============================================================================
  # Projection Builder (builds read models from events)
  # ============================================================================
  projection-builder:
    image: postgres:16-alpine
    container_name: surypus_projection_builder
    entrypoint: ["/bin/sh", "/scripts/build-projections.sh"]
    volumes:
      - ./scripts/build-projections.sh:/scripts/build-projections.sh:ro
    environment:
      - DATABASE_URL=postgresql://surypus:surypus_secret@postgres:5432/surypus
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - surypus_network
    restart: unless-stopped

  # ============================================================================
  # Prometheus for metrics
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: surypus_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - surypus_network

  # ============================================================================
  # Grafana for dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: surypus_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - surypus_network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redpanda_data:
  prometheus_data:
  grafana_data:

networks:
  surypus_network:
    driver: bridge
