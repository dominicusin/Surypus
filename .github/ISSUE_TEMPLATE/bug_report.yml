name: Bug Report
description: Сообщить об ошибке
title: "[BUG]: "
labels:
  - "bug"
  - "status: needs-triage"

body:
  - type: dropdown
    id: severity
    attributes:
      label: Критичность
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Компонент / модуль
      placeholder: "например, API, Core, CLI"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: "ОС, версия GHC/Cabal, commit/tag, способ запуска."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи / трассировка
      render: text
