name: Feature Request
description: Предложить новую функцию
title: "[FEAT]: "
labels:
  - "feature"
  - "status: needs-triage"

body:
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Компонент / модуль
      placeholder: "например, API, Core, CLI"

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      placeholder: "Как [роль], я хочу [действие], чтобы [результат]"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Проблема / мотивация
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Критерии приемки
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
