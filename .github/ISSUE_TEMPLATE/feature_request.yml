name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? Let us know!

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the feature
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / User Story
      description: Why is this feature needed? Who benefits?
      placeholder: |
        As a [type of user], I want [goal] so that [benefit].
        
        Currently, users have to... This change would...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions have you considered?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (blocking release)
        - High (important for next release)
        - Medium (nice to have)
        - Low (future consideration)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
