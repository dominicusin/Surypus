name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'priority: critical'
  minor:
    labels:
      - 'feature'
      - 'priority: high'
  patch:
    labels:
      - 'bug'
      - 'documentation'
      - 'refactor'
      - 'performance'
  default: patch
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
  - title: '♻️ Refactoring'
    labels:
      - 'refactor'
  - title: '🔧 Maintenance'
    labels:
      - 'dependencies'
      - 'chore'
exclude-labels:
  - 'status: blocked'
template: |
  ## What's Changed

  $CHANGES
  
  **Full Changelog**: https://github.com/surypus/surypus/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
