# Labeler v5 configuration
# https://github.com/actions/labeler

# Labels based on file paths changed
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - 'LICENSE'

# Labels based on branch name
bug:
  - head-branch:
      - '^fix/'
      - '^bugfix/'
      - '^hotfix/'

feature:
  - head-branch:
      - '^feat/'
      - '^feature/'

performance:
  - head-branch:
      - '^perf/'
      - '^performance/'

refactor:
  - head-branch:
      - '^refactor/'
      - '^refactoring/'

# Labels based on file paths
security:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/secret-guard.yml'
          - '.github/workflows/codeql.yml'
          - 'SECURITY.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/Dockerfile'
          - '**/package.json'
          - '**/yarn.lock'
          - '**/stack.yaml'
          - '**/stack.yaml.lock'
          - '**/cabal.project'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/*.yml'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*Spec.hs'
          - '**/*Test.hs'

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - 'packaging/**'
          - '**/Dockerfile'
          - '.dockerignore'

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/**'
          - '**/*.js'
          - '**/*.jsx'
          - '**/*.ts'
          - '**/*.tsx'
