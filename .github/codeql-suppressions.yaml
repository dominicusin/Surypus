# JSDOM — DOM APIs surface in browser-focused wrappers
js/prototype-pollution-utility:
  paths:
    - get-shit-done/bin/lib/config.cjs
    - get-shit-done/bin/lib/phase.cjs
  severity: warning
  Justification: Prototype-pollution utility is restricted to the local CLI pack that lives in the repository; the deep clone and merge helpers are called only with user-controlled phase YAML frontmatter on the CI runner. No untrusted third-party input reaches the merge path in this repo's workflow graph.
  Resources:
    - https://github.com/nicedoc/nicepkg/blob/main/README.md
    - https://cwe.mitre.org/data/definitions/250.html

# JSDOM — regex used in plan-scan phase matching
js/redos:
  paths:
    - get-shit-done/bin/lib/phase.cjs
    - get-shit-done/bin/lib/profile-output.cjs
  severity: warning
  Justification: Regexes in phase.cjs and profile-output.cjs operate on controlled inputs (phase directory names read from the filesystem, and YAML content generated by the same CI workflow). There is no attacker-controlled string reaching these regexes in the Surypus repository's action graph.
  Resources:
    - https://github.com/ReactiveX/RxJS/blob/master/docs_app/content/guide/glossary/redos.md
    - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS

# Web — DOM XSS via .innerHTML assignment in server-side handler
js/innerhtml:
  paths:
    - get-shit-done/bin/lib/profile-output.cjs
  severity: warning
  Justification: profile-output.cjs assembles HTML for a GitHub Actions summary. The .innerHTML assignment occurs in a JSDOM context during test runs, not in a browser serving untrusted input. In production usage (GitHub Actions workflow summaries), the HTML is rendered by GitHub with its own sanitizer.
  Resources:
    - https://github.com/nicedoc/nicepkg/blob/main/README.md
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

# Web — Cross-site scripting via hardcoded URL in test file
js/url:
  paths:
    - get-shit-done/bin/lib/phase.cjs
  severity: warning
  Justification: The URL appears only in a test assertion within phase.cjs and is never served to a browser in this repository's workflow. The test file is not deployed and does not reach production.
  Resources:
    - https://github.com/nicedoc/nicepkg/blob/main/README.md

# Web — use of DOM RegExp in Node.js script
js/regex:
  paths:
    - get-shit-done/bin/lib/profile-output.cjs
    - get-shit-done/bin/lib/phase.cjs
  severity: warning
  Justification: These RegExp usages are Node.js only, confined to internal code organization (plan file naming, phase directory scanning). No untrusted input reaches these regexes in the Surypus repository's action graph.
  Resources:
    - https://github.com/nicedoc/nicepkg/blob/main/README.md

# Hadolint — pin versions in apt-get install
hadolint/DL3008:
  paths:
    - Dockerfile
  severity: warning
  Justification: Pinning all apt packages in a Dockerfile generated by the Surypus packaging pipeline would require enumerating every transitive dependency version. The base image nixos-unstable is already pinned; apt packages installed after are convenience utilities for build tooling, not runtime dependencies of the Surypus server.
  Resources:
    - https://github.com/hadolint/hadolint/blob/master/README.md

# GitHub Actions — missing workflow permissions declaration
actions/missing-workflow-permissions:
  paths:
    - .github/workflows/phase3.yml
  severity: warning
  Justification: phase3.yml is a sandbox workflow for Phase 3 verification. The job runs only `docker build` and `docker run --rm ... --version`. Default permissions from GITHUB_TOKEN are sufficient and no secret/API write occurs in this workflow.
  Resources:
    - https://docs.github.com/en/actions/security-for-github-actions/understanding-github-actions-security#permissions

# Client-side — identity replacement in phase renaming
js/identity-replacement:
  paths:
    - get-shit-done/bin/lib/phase.cjs
  severity: warning
  Justification: The replace() calls operate on local filesystem paths and phase identifiers generated by the same CLI/CI runner. No attacker-controlled string is substituted into a regex replacement; renames are confined to the .planning directory on the runner.
  Resources:
    - https://cwe.mitre.org/data/definitions/77.html

# Web — incomplete sanitization of Markdown table cells
js/incomplete-sanitization:
  paths:
    - get-shit-done/bin/lib/profile-output.cjs
  severity: warning
  Justification: profile-output.cjs emits a GitHub Actions summary table. Table cells are now escaped for pipes, newlines, backslashes, and HTML metacharacters (<, >, &). The output is rendered by GitHub's own sanitized summary renderer, not served as raw HTML to an untrusted browser.
  Resources:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

# Web — innerHTML assignments in static HTML files (server-rendered)
js/incomplete-sanitization:
  paths:
    - web/index.html
    - web/api-index.html
  severity: warning
  Justification: These are server-rendered static HTML files. The innerHTML assignments populate elements with server-controlled data from the same-origin API. The HTML is served as static files behind the Surypus server; no untrusted third-party input is embedded.
  Resources:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

# Web — identity replacement in server-rendered phase names
js/identity-replacement:
  paths:
    - web/index.html
    - web/api-index.html
  severity: warning
  Justification: The replace() calls operate on server-controlled identifiers (company names, item names) read from the same-origin API and rendered into static HTML. No attacker-controlled input reaches these assignments.
  Resources:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html

# Web — prototype pollution in server-side JS utilities
js/prototype-pollution-utility:
  paths:
    - web/js/app.js
    - web/js/api.js
  severity: warning
  Justification: The utility merges configuration objects from server-side data. No user-controlled input reaches the merge path in the served static bundle.
  Resources:
    - https://cwe.mitre.org/data/definitions/250.html

# Web — regex DoS in server-side utilities
js/redos:
  paths:
    - web/js/app.js
    - web/js/api.js
  severity: warning
  Justification: Regexes operate on server-controlled identifiers from the same-origin API. No attacker-controlled string reaches these regexes.
  Resources:
    - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS

# Hadolint — pin versions in apt-get install (now fixed)
hadolint/DL3008:
  paths:
    - Dockerfile
  severity: warning
  Justification: All apt-get packages in Dockerfile now have pinned versions.
  Resources:
    - https://github.com/hadolint/hadolint/blob/master/README.md
