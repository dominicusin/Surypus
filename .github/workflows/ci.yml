name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Stack
        run: |
          curl -sSL https://get.haskellstack.org/ | sh
      - name: Build
        run: |
          stack --version
          stack build --test --no-run-tests
      - name: Run tests
        run: |
          stack test --test-arguments --color
      - name: Dry-run migrations (DSL)
        run: |
          bash scripts/ci-dry-run-mig.sh
      - name: Migration Verification Suite
        run: |
          bash scripts/ci-migration-verification.sh
