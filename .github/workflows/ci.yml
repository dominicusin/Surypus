name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Haskell
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.6.6'
        cabal-version: '3.10.2.0'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal/store
          .stack-work
        key: ${{ runner.os }}-haskell-${{ hashFiles('**/*.cabal', '**/stack.yaml') }}
        restore-keys: |
          ${{ runner.os }}-haskell-
    
    - name: Build
      run: |
        stack build
    
    - name: Run tests
      run: |
        stack test
    
    - name: Check formatting
      run: |
        stack build --flags="+HLint" 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Haskell
      uses: haskell/actions/setup@v2
      with:
        ghc-version: '9.6.6'
    
    - name: Install hlint
      run: cabal install hlint
    
    - name: Run hlint
      run: |
        hlint src/

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t surypus:latest .
