name: Surypus CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Haskell
      uses: haskell/setup-haskell@v1
      with:
        ghc-version: '9.6.6'
        stack-version: 'latest'
    
    - name: Cache Stack dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('**/*.cabal', '**/stack.yaml', '**/stack.yaml.lock') }}
        restore-keys: |
          ${{ runner.os }}-stack-
    
    - name: Build
      run: stack build
    
    - name: Run tests
      run: stack test

    - name: Verify engineering docs
      run: |
        test -f docs/engineering/job-server-etl.md
        test -f docs/engineering/reports-portal.md

    - name: Check formatting
      run: stack exec hindent -- --check src/
    
    - name: Lint
      run: stack exec hlint src/
    
  docker:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t surypus:${{ github.sha }} .
        docker tag surypus:${{ github.sha }} surypus:latest
    
    - name: Push to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push surypus:${{ github.sha }}
        docker push surypus:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to server
      run: |
        echo "Deploying to production server..."
        # Add deployment commands here
