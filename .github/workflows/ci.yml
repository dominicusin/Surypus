name: Surypus CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.2'
          cabal-version: '3.10'
          stack-version: '2.11'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            ~/.cabal
            .stack-work
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', '**/*.yaml', '**/stack.yaml', '**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libffi-dev libtinfo-dev zlib1g-dev liblmdb-dev libssl-dev
      - name: Build
        run: stack build
      - name: Test
        run: stack test
      - name: HLint
        run: |
          hlint src/ || echo "HLint warnings (non-fatal)"