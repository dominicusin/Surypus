name: Surypus CI
on:
  push:
    branches:
      - main
      - phase1-stabilize-core
  pull_request:
    branches:
      - main
      - phase1-stabilize-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Install Docker Compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y docker-compose

      - name: Start DB
        run: |
          docker compose up -d db
          echo "Waiting for DB to be ready..."
          for i in {1..60}; do
            if docker compose exec -T db pg_isready -U surypus -d surypus >/dev/null 2>&1; then echo 'DB ready'; break; fi
            sleep 2
          done

      - name: Build
        run: |
          stack build --fast

      - name: Run Tests
        run: |
          # Gate RBAC tests by default in CI until environment is stable
          # Swagger tests are now enabled (real OpenAPI spec is served)
          OPENPAPYRUS_SKIP_RBAC_TESTS=1 stack test

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans
