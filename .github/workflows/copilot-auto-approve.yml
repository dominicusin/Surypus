name: Copilot Auto-Approve

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-approve:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' || github.event.review.state == 'approved')
    steps:
      - name: Auto-approve if Copilot reviewed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const copilotReview = reviews.find(r => 
              r.user?.login?.includes('copilot') || 
              r.user?.login?.includes('github-advanced-security')
            );
            
            if (copilotReview && copilotReview.state === 'APPROVED') {
              console.log('Copilot already approved this PR');
              return;
            }
            
            // Check if all CI checks pass
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            
            const allPassed = checks.check_runs.every(c => 
              c.conclusion === 'success' || c.conclusion === 'skipped'
            );
            
            if (allPassed) {
              console.log('All CI checks passed - ready for auto-merge');
            }
