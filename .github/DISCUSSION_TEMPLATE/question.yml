title: "❓ Question / Help"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Check our [FAQ](https://github.com/surypus/surypus/discussions/categories/q-a) first!

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: "How do I..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing discussions
          required: true
        - label: I have checked the documentation
          required: true
        - label: I have read the README
          required: true
