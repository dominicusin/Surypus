openapi: 3.0.3
info:
  title: Surypus API
  version: 0.1.0
  description: API for Surypus ERP/CRM system
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  /api/v1/roles:
    get:
      summary: Get all roles
      responses:
        '200':
          description: A list of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /api/v1/persons:
    get:
      summary: Get all persons
      responses:
        '200':
          description: A list of persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
  /api/v1/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
components:
  schemas:
    Role:
      type: object
      properties:
        roleId:
          type: integer
          example: 1
        roleName:
          type: string
          example: admin
    Person:
      type: object
      properties:
        personId:
          type: integer
          example: 1
        personName:
          type: string
          example: John Doe
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: secret
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token