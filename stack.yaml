# stack.yaml for OpenPapyrus-HS
resolver: lts-22.30

packages:
  - .
  - vendor/hashtables-1.3.1
  - vendor/semigroupoids-6.0.1
  - vendor/unix-2.8.8.0
  - vendor/hashable-1.4.4.0

ghc-options:
  "$locals": -Wall

allow-newer: true
allow-newer-deps:
  - process
  - file-io
  - filepath
  - cabal-doctest
  - entropy
  - hasql
  - postgresql-libpq
  - vector

flags:
  unix:
    os-string: true
  process:
    os-string: true
  file-io:
    os-string: true
  directory:
    os-string: true

extra-deps:
  - hasql-1.4.5.3
  - hasql-pool-0.7.2
  - postgresql-binary-0.12.5
  - postgresql-libpq-0.10.2.0@sha256:7a31a758c0e9e4e608f0408c28dfb321d6a94811572892b826f66c7a387d1156,2665
