   - servant-swagger-1.2.1
   - swagger2-2.8.10
   - Decimal-0.5.2
   - smtp-mail-0.1.0.0
   - http-client-0.7.13.1
   - http-client-tls-0.3.6.1
   - yaml-0.11.11.0
   - hasql-1.6.4.2
    - hasql-pool-0.10.1
    - postgresql-libpq-0.11.0.0@sha256:682d17c7bce588902dc01dc255328d8de4c633f98c7837eed8e5f1cc8b445af5,2717
    - postgresql-binary-0.14
   - hasql-postgres-1.6.4.2
