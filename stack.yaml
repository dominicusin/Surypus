# stack.yaml for Surypus
resolver: nightly-2026-04-05

nix:
  enable: false
  packages:
    - zlib
    - gmp
    - pcre
    - libffi
    - ncurses
    - postgresql

packages:
  - .
  - surypus-common
  - surypus-api
  - surypus-frontend

ghc-options:
  "$locals": -Wall -Wcompat

allow-newer: true
allow-different-user: true
system-ghc: true

extra-deps:
   - liquidhaskell-0.8.10.7.1
   - liquid-base-4.15.1.0
   - liquid-containers-0.6.4.1
   - validation-selective-0.2.0.0
