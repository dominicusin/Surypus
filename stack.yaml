# stack.yaml for Surypus
resolver: lts-22.21

nix:
  enable: false
  packages:
    - zlib
    - gmp
    - pcre
    - libffi
    - ncurses
    - postgresql

packages:
  - .

ghc-options:
  "$locals": -Wall -Wcompat

allow-newer: true
allow-different-user: true

# Avoid crypton (build hangs); use cryptonite from snapshot/extra-deps instead
flags:
  hashtables:
    portable: true
    sse42: false
    unsafe-tricks: false
  warp:
    x509: false
  wai-app-static:
    crypton: false

extra-deps:
  - ekg-0.4.1.2
  - ekg-core-0.1.1.7
  - ekg-json-0.1.1.1
  - cryptonite-0.30
  # jose >=0.11 depends on crypton (problematic build); 0.10 uses cryptonite
  - jose-0.10
  # hashtables compatible with GHC 9.6.5
  - hashtables-1.4.2
  # SMTP email notifications
  - smtp-mail-0.4.0.2
  - mime-mail-0.5.1
  - leksah-server-0.16.3.0@sha256:6bc8281b0be30622118695525b3d145745a21e9f1171c0de4d1e1b28a0540cf4,7059
  - ltk-0.16.2.0@sha256:77c0b1fdf63cea173cded18a72ab04433c405025f9df01c8b95a5ee563bb313e,2422
  - regex-tdfa-text-1.0.0.3@sha256:fb72123627eadf43dd5ca74a2896940d50aac291e61f62177960f0563f7d5c03,1180
  - vado-0.0.14@sha256:f7094823246d4149cc6398110df86c3949f68cdce413718fe687cebc18235b53,2149
  - vcsgui-0.2.2.0@sha256:d4e0ae2aa0cec2054e77a7791bf36bef40d65d16f75cc49c8f68a5a2669cf1c9,4379
  - vcswrapper-0.1.6@sha256:8b45a960bf6003ac52f84a80051dc62ff26ff34fb04561590cef7028f921ebe1,2560
  - haddock-api-2.18.1@sha256:fed04e4cde7abe46a4fd03ed0e0c5a9a132cb06707ecaef6b8eaddbb8e5a9d59,4404


