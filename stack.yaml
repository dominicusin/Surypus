# stack.yaml for Surypus
resolver: lts-22.21

nix:
  enable: false
  packages:
    - zlib
    - gmp
    - pcre
    - libffi
    - ncurses
    - postgresql

packages:
  - .
  - surypus-common
  - surypus-api

ghc-options:
  "$locals": -Wall -Wcompat

allow-newer: true
allow-different-user: true

# Avoid crypton (build hangs); use cryptonite from snapshot/extra-deps instead
flags:
  warp:
    x509: false
  wai-app-static:
    crypton: false

extra-deps:
  - ekg-0.4.1.2
  - ekg-core-0.1.1.7
  - ekg-json-0.1.1.1
  - cryptonite-0.30
  # jose >=0.11 depends on crypton (problematic build); 0.10 uses cryptonite
  - jose-0.10
  # hashtables with fixed bounds for GHC 9.8.4
  - hashtables-1.3.1
