# stack.yaml for Surypus
resolver: lts-22.21

packages:
  - .

ghc-options:
  "$locals": -Wall

allow-newer: false

flags:
  hashtables:
    portable: true
    sse42: false
    unsafe-tricks: false
  warp:
    x509: false
  wai-app-static:
    crypton: false

extra-deps:
  - ekg-0.4.1.2
  - ekg-core-0.1.1.7
  - ekg-json-0.1.1.1
  - cryptonite-0.30
  - jose-0.10
  - hashtables-1.4.2
  - smtp-mail-0.4.0.2
  - mime-mail-0.5.1
