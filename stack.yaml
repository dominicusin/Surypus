# stack.yaml for Surypus
resolver: nightly-2026-04-05

#nix:
#  enable: true

packages:
  - .

ghc-options:
  "$locals": -Wall -Wcompat

allow-newer: true
allow-different-user: true
system-ghc: false

extra-deps:
  - liquidhaskell-0.8.10.7.1
  - liquid-base-4.15.1.0
  - liquid-containers-0.6.4.1
  - validation-selective-0.2.0.0
  - cryptonite-0.30
  - servant-swagger-1.2.1
  - swagger2-2.8.10
  - Decimal-0.5.2
  - smtp-mail-0.1.0.0
  - http-client-0.7.13.1
  - http-client-tls-0.3.6.1
  - yaml-0.11.11.0
  
