# stack.yaml for Surypus
resolver: lts-22.21

nix:
  enable: false
  packages:
    - zlib
    - gmp
    - pcre
    - libffi
    - ncurses
    - postgresql

packages:
  - .
  - surypus-common
  - surypus-api

ghc-options:
  "$locals": -Wall -Wcompat

allow-newer: true
allow-different-user: true

extra-deps:
  - ekg-0.4.1.2
  - ekg-core-0.1.1.7
  - ekg-json-0.1.1.1
  - cryptonite-0.30

# Disable crypton to use cryptonite from snapshot
constraints:
  - crypton -any
  - cryptonite == 0.30
