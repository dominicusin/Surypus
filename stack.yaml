  - vector-0.13.2.0
  - Cabal-3.16.1.0
  - Cabal-syntax-3.16.1.0
  - exceptions-0.10.12
  - filepath-1.5.5.0@sha256:c6ec08084ffc90838ad36d03c3792be70fa171942a3677ec68e9be8b437754fe,5314
